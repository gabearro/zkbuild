[workspace]
resolver = "2"
members = [
  "crates/zkb-field",
  "crates/zkb-stark",
  "crates/zkb-vm",
  "crates/zkb-air",
  "crates/zkb-ca",
  "crates/zkb-proof",
  "crates/zkb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
blake3 = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
bincode = "1"
anyhow = "1"
rayon = "1"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = 1
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
